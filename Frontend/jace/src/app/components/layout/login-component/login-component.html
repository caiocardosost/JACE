<main class="login">

  <!-- Lado da marca (no mobile vira uma faixa no topo) -->
  <section class="login__marca">
    <div class="login__logo" aria-hidden="true">{{ marca.nome.charAt(0) }}</div>
    <p class="login__sistema">{{ marca.nome }}</p>
    <p class="login__slogan">{{ marca.slogan }}</p>
    <p class="login__descricao">
      Pacientes, prontuários e agenda do consultório em um só lugar.
    </p>
  </section>

  <!-- Lado do formulário -->
  <section class="login__area">
    <form class="login__form" (ngSubmit)="entrar()">

      <h1 class="login__titulo">Bem-vindo!</h1>
      <p class="login__sub">Acesse sua conta para continuar.</p>

      <div class="grupo">
        <label class="rotulo" for="usuario">Usuário</label>
        <input id="usuario" name="usuario" type="text" class="campo"
               autocomplete="username" autofocus />
      </div>

      <div class="grupo">
        <label class="rotulo" for="senha">Senha</label>
        <div class="campo-senha">
          <input id="senha" name="senha" class="campo campo--com-botao"
                 autocomplete="current-password"
                 [type]="mostrarSenha() ? 'text' : 'password'" />
          <button type="button" class="campo-senha__botao"
                  [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'"
                  (click)="mostrarSenha.set(!mostrarSenha())">
            {{ mostrarSenha() ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
      </div>

      <button type="submit" class="botao botao--primario">Entrar</button>

      <p class="login__rodape">Problemas para acessar? Fale com o administrador.</p>
    </form>
  </section>

</main>
